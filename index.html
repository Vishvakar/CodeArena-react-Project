<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="description" content="CodeArena - practice coding problems, run tests in your browser and track your progress." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CodeArena | Practice coding</title>
    <script>
      try {
        var t = localStorage.getItem('codearena:theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <style>
      .splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(ellipse at 70% -10%, #17254a 0, transparent 45%), #0b0f1a; color: #e8edf7;
        font-family: 'DM Sans', system-ui, sans-serif; transition: opacity .45s ease, visibility .45s ease; }
      :root[data-theme='light'] .splash { background: radial-gradient(ellipse at 70% -10%, #dfe6ff 0, transparent 45%), #f4f6fb; color: #141b2d; }
      .splash.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash-logo { position: relative; width: 72px; height: 72px; display: grid; place-items: center; border-radius: 20px; background: #725cf3; color: #fff;
        box-shadow: 0 10px 40px rgba(114, 92, 243, .45); animation: splash-float 2.2s ease-in-out infinite; }
      .splash-logo::after { content: ''; position: absolute; inset: -10px; border-radius: 28px; border: 2px solid #725cf3; opacity: 0; animation: splash-ring 1.8s ease-out infinite; }
      .splash-name { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
      .splash-name span { color: #725cf3; }
      .splash-tag { margin-top: -14px; font-size: 13px; opacity: .65; }
      .splash-bar { width: 180px; height: 4px; border-radius: 4px; overflow: hidden; background: rgba(127, 127, 160, .25); }
      .splash-bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #725cf3, #38bdf8); animation: splash-slide 1.2s ease-in-out infinite; }
      @keyframes splash-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes splash-ring { 0% { transform: scale(.85); opacity: .7; } 100% { transform: scale(1.35); opacity: 0; } }
      @keyframes splash-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(350%); } }
      @media (prefers-reduced-motion: reduce) { .splash-logo, .splash-logo::after, .splash-bar i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash" id="boot-splash" role="status" aria-label="Loading CodeArena">
      <div class="splash-logo"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div>
      <div class="splash-name">Code<span>Arena</span></div>
      <div class="splash-tag">Practice with purpose</div>
      <div class="splash-bar"><i></i></div>
    </div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
